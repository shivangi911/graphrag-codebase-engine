[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-codebase-engine"
version = "0.1.0"
description = "GraphRAG & codebase intelligence engine: AST knowledge graph, hybrid retrieval, multi-agent refactoring loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "networkx>=3.2",
  "qdrant-client>=1.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "langgraph>=0.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.7"]
ollama = ["ollama>=0.3"]
swebench = ["datasets>=2.19"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
graphrag = "graphrag_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
